[project]
name = "text-kit"
version = "0.1.0"
description = "Small text utilities used in the Python 301 packaging exercises"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "textkit-stats",
]

[project.scripts]
textkit = "textkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["textkit"]

[tool.uv.sources]
textkit-stats = { path = "vendor/textkit-stats", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]
