[project]
name = "text-kit"
version = "0.1.0"
description = "Small text utilities used in the Python 301 packaging exercises"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0.0"]

[project.scripts]
textkit = "textkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["textkit"]
