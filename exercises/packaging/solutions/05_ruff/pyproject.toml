[project]
name = "text-kit"
version = "0.1.0"
description = "Small text utilities used in the Python 301 packaging exercises"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "textkit-stats",
]

[project.scripts]
textkit = "textkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["textkit"]

[tool.uv.sources]
textkit-stats = { path = "vendor/textkit-stats", editable = true }

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = true
